name: verify

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  node-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Script tests (PowerShell helpers and provider-smoke selectors)
        shell: pwsh
        run: |
          npx vitest --version
          Get-ChildItem scripts -Filter *.test.mjs | Select-Object Name
          npx vitest run --config vitest.scripts.config.ts --reporter=verbose 2>&1 |
            Tee-Object -FilePath vitest-scripts.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content vitest-scripts.log -Tail 12) -join " | "
            Write-Host "::error title=script-tests::$tail"
          }
          exit $code
      - name: Upload script test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-scripts-log
          path: vitest-scripts.log

  rust:
    runs-on: windows-latest
    env:
      # MSVC chokes on the debug record for some C dependencies (ring) when the
      # checkout path is long; tests do not need debug info.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
