name: release-smoke

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-smoke.yml"
      - "backend/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  clean-wheel:
    name: clean ${{ matrix.os }} wheel install
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install into a fresh venv and run the gate
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .clean
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.clean/Scripts/python.exe
          else
            PY=.clean/bin/python
          fi
          $PY -m pip install --upgrade pip
          $PY -m pip install dist/*.whl
          mkdir -p ci-sample
          cat > ci-sample/deploy.py <<'PY'
          import subprocess

          def run(request):
              return subprocess.run("nslookup " + request.args["host"], shell=True).stdout
          PY
          set +e
          $PY -m agent_crossbar.security.cli --root ci-sample --format sarif -o ci-security.sarif
          code=$?
          set -e
          test "$code" -eq 1
          test -s ci-security.sarif
          $PY scripts/demo.py
          test -s work/demo/review.md
          test -s work/demo/review.sarif
      - name: Sign wheel with Sigstore
        if: matrix.os == 'ubuntu-latest'
        uses: sigstore/cosign-installer@v3
      - name: Produce keyless signature
        if: matrix.os == 'ubuntu-latest'
        run: |
          cosign sign-blob --yes dist/*.whl \
            --output-signature dist/agent_crossbar.sig \
            --output-certificate dist/agent_crossbar.pem
      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.sig
            dist/*.pem
            ci-security.sarif
            work/demo/review.md
            work/demo/review.sarif

  clean-msi:
    name: clean windows MSI build + install
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync
          npm ci
      - name: Build sidecar and MSI
        run: |
          npm run sidecar:build
          npm run tauri build
      - name: Install MSI silently
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          Write-Host "Installing $($msi.FullName)"
          $process = Start-Process msiexec.exe -ArgumentList @("/i", $msi.FullName, "/qn", "/norestart", "/l*v", "msi-install.log") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "msiexec install failed: $($process.ExitCode)" }
          $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Recurse -Filter "Agent Crossbar.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "installed executable not found" }
          Write-Host "Installed: $($installed.FullName)"
          $uninstall = Start-Process msiexec.exe -ArgumentList @("/x", $msi.FullName, "/qn", "/norestart", "/l*v", "msi-uninstall.log") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "msiexec uninstall failed: $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            msi-install.log
            msi-uninstall.log
