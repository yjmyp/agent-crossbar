name: release-smoke

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-smoke.yml"
      - "backend/**"
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  clean-wheel:
    name: clean ${{ matrix.os }} wheel install
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install into a fresh venv and run the gate
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .clean
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.clean/Scripts/python.exe
          else
            PY=.clean/bin/python
          fi
          $PY -m pip install --upgrade pip
          $PY -m pip install dist/*.whl
          echo "--- import origin must be the venv, not the checkout ---"
          $PY -c "import agent_crossbar, pathlib, sys; p = pathlib.Path(agent_crossbar.__file__).resolve(); print(p); sys.exit(0 if '.clean' in p.parts else 1)"
          mkdir -p ci-sample
          cat > ci-sample/deploy.py <<'PY'
          import subprocess

          def run(request):
              return subprocess.run("nslookup " + request.args["host"], shell=True).stdout
          PY
          set +e
          $PY -m agent_crossbar.security.cli --root ci-sample --format sarif -o ci-security.sarif
          code=$?
          set -e
          test "$code" -eq 1
          test -s ci-security.sarif
          $PY scripts/demo.py
          test -s work/demo/review.md
          test -s work/demo/review.sarif
      - name: Sign wheel with Sigstore
        if: matrix.os == 'ubuntu-latest'
        uses: sigstore/cosign-installer@v3
      - name: Produce keyless signature
        if: matrix.os == 'ubuntu-latest'
        run: |
          cosign sign-blob --yes dist/*.whl \
            --output-signature dist/agent_crossbar.sig \
            --output-certificate dist/agent_crossbar.pem
      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.sig
            dist/*.pem
            ci-security.sarif
            work/demo/review.md
            work/demo/review.sarif

  pipx-install:
    name: clean windows pipx install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install with pipx and run from PATH
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --user pipx
          python -m pipx install dist/*.whl
          export PATH="$HOME/.local/bin:$PATH"
          crossbar-security --help
          mkdir -p pipx-sample
          cat > pipx-sample/agent_tool.py <<'PY'
          import subprocess

          def run(request):
              return subprocess.run("rm -rf " + request.args["path"], shell=True)
          PY
          set +e
          crossbar-security --root pipx-sample --format sarif -o pipx-security.sarif
          code=$?
          set -e
          test "$code" -eq 1
          test -s pipx-security.sarif
          python -c "import json; d=json.load(open('pipx-security.sarif', encoding='utf-8')); print('findings:', len(d['runs'][0]['results']))"
      - name: Record installed location
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          which crossbar-security
          python -m pipx list

  clean-msi:
    name: clean windows MSI build + install
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      HAS_SIGNING_CERT: ${{ secrets.AGENT_CROSSBAR_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync
          npm ci
      - name: Build sidecar and MSI
        run: |
          npm run sidecar:build
          npm run tauri build
      - name: Sign MSI and executable (only when a real certificate is configured)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          AGENT_CROSSBAR_PFX_BASE64: ${{ secrets.AGENT_CROSSBAR_PFX_BASE64 }}
          AGENT_CROSSBAR_PFX_PASSWORD: ${{ secrets.AGENT_CROSSBAR_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "agent-crossbar.pfx"
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AGENT_CROSSBAR_PFX_BASE64))
          $targets = @()
          $targets += (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object FullName)
          $targets += (Get-ChildItem "src-tauri/target/release/*.exe" | ForEach-Object FullName)
          if ($targets.Count -eq 0) { throw "no signing targets found" }
          ./scripts/sign-windows.ps1 -Files $targets -PfxPath $pfx
          foreach ($file in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            Write-Host "$file -> $($signature.Status)"
            if ($signature.Status -ne "Valid") { throw "signature is not valid: $file" }
          }
      - name: Record signature status
        if: always()
        shell: pwsh
        run: |
          $lines = @()
          foreach ($file in Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $lines += [pscustomobject]@{
              path = $file.FullName
              status = $signature.Status.ToString()
              subject = $signature.SignerCertificate.Subject
            }
          }
          $lines | ConvertTo-Json -Depth 3 | Set-Content signature-status.json
          $lines | Format-Table | Out-String | Write-Host
          if ($env:HAS_SIGNING_CERT -ne "true") {
            Write-Host "::warning::No production Authenticode certificate configured; MSI is unsigned. See docs/verification/authenticode.md."
          }
      - name: Verify MSI payload by administrative extract
        if: always()
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $target = Join-Path $env:RUNNER_TEMP "msi-extract"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $sevenZip = @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $sevenZip) { throw "7-Zip is required to inspect the MSI payload" }
          Write-Host "Extracting with $sevenZip"
          & $sevenZip x $msi.FullName "-o$target" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed with exit code $LASTEXITCODE" }
          $exe = Get-ChildItem $target -Recurse -Filter "Agent Crossbar.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "MSI payload does not contain Agent Crossbar.exe" }
          $sidecar = Get-ChildItem $target -Recurse -Filter "agent-crossbar-sidecar*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sidecar) { throw "MSI payload does not contain the sidecar" }
          Write-Host "MSI payload verified:"
          Write-Host "  $($exe.FullName)"
          Write-Host "  $($sidecar.FullName)"
      - name: Install MSI silently
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          Write-Host "Installing $($msi.FullName)"
          $process = Start-Process msiexec.exe -ArgumentList @(
            "/i", $msi.FullName, "/qn", "/norestart", "REBOOT=ReallySuppress", "/l*v", "msi-install.log"
          ) -PassThru
          if (-not $process.WaitForExit(600000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "msiexec did not finish within 10 minutes; see msi-install.log"
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "msiexec install failed: $($process.ExitCode)" }
          $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Recurse -Filter "Agent Crossbar.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "installed executable not found" }
          Write-Host "Installed: $($installed.FullName)"
          $installedPath = $installed.FullName
          $uninstall = Start-Process msiexec.exe -ArgumentList @(
            "/x", $msi.FullName, "/qn", "/norestart", "/l*v", "msi-uninstall.log"
          ) -PassThru
          if (-not $uninstall.WaitForExit(300000)) {
            Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
            throw "msiexec uninstall did not finish within 5 minutes; see msi-uninstall.log"
          }
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "msiexec uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $installedPath) { throw "executable still present after uninstall: $installedPath" }
          Write-Host "Uninstall removed the executable."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            msi-install.log
            msi-uninstall.log
            msi-extract.log
            signature-status.json
